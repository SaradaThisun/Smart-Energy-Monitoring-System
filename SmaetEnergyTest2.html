<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Energy Dashboard</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            background: #1a1d26;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
            color: #fff;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffffff;
        }

        /* Main container */
        .main-container {
            width: 100%;
            max-width: 1200px;
        }

        /* Energy Control Hub */
        .energy-summary {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Card Styles */
        .card {
            background: #282f3a;
            color: #fff;
            padding: 20px;
            width: 220px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: 0.3s ease-in-out;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .value {
            font-size: 36px;
            margin-top: 10px;
            font-weight: bold;
            color: #00e5ff;
        }

        .label {
            font-size: 16px;
            color: #bbb;
        }

        .power-calculation {
            background: #4caf50;
            color: white;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
        }

        /* Devices Section */
        .devices-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .device-card {
            background: #282f3a;
            color: #fff;
            padding: 20px;
            width: 250px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: 0.3s ease-in-out;
        }

        .device-card:hover {
            transform: translateY(-5px);
        }

        .device-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .device-status {
            background: #ff9800;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .device-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .device-controls button {
            background: #0077b6;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }

        .device-controls button:hover {
            background: #00e5ff;
        }

        /* Energy Consumption Chart */
        .chart-container {
            width: 80%;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <h1>Smart Energy Dashboard</h1>

    <!-- Energy Summary Section -->
    <div class="main-container">
        <div class="energy-summary">
            <div class="card">
                <div class="label">Total Wastage</div>
                <div id="totalWastage" class="value">-- kWh</div>
                <div class="label">↑ 12% This Week</div>
            </div>
            <div class="card">
                <div class="label">Total Consumption</div>
                <div id="totalConsumption" class="value">-- W</div>
                <div class="label">↑ 3% from yesterday</div>
            </div>
            <div class="card">
                <div class="label">Avg Efficiency</div>
                <div id="avgEfficiency" class="value">-- %</div>
                <div class="label">↑ 2% improvement</div>
            </div>
            <div class="card">
                <div class="label">Online Devices</div>
                <div id="onlineDevices" class="value">-- /5</div>
                <div class="label">1 Offline</div>
            </div>
        </div>

        <!-- Connected Devices Section -->
        <div class="device-header">Connected Devices</div>
        
        <div class="devices-container" id="devicesContainer">
            <!-- Devices will be populated here dynamically -->
        </div>

    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
    apiKey: "AIzaSyDBFy0g9TAQawRNsO6F9IRhnkP5TZQQLfU",
    authDomain: "test1-230d1.firebaseapp.com",
    databaseURL: "https://test1-230d1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "test1-230d1",
    storageBucket: "test1-230d1.firebasestorage.app",
    messagingSenderId: "761603525569",
    appId: "1:761603525569:web:f840de48d1f9ba5111fd40"
  };  
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Fetch total wastage, consumption, and efficiency
        const wastageRef = firebase.database().ref("/energy/wastage");
        const consumptionRef = firebase.database().ref("/energy/consumption");
        const efficiencyRef = firebase.database().ref("/energy/efficiency");
        const devicesRef = firebase.database().ref("/devices");
        const database = firebase.database();

        // Define the data structure
const energyData = {
  wastage: 123,
  consumption: 1580,
  efficiency: 82
};

const devicesData = {
  device1: {
    name: "Fridge",
    status: "ONLINE",
    wastage: 42,
    power: 340,
    efficiency: 78
  },
  device2: {
    name: "TV",
    status: "ONLINE",
    wastage: 18,
    power: 820,
    efficiency: 92
  },
  device3: {
    name: "Iron",
    status: "OFFLINE",
    wastage: 9,
    power: 60,
    efficiency: 85
  },
  device4: {
    name: "Fan",
    status: "ONLINE",
    wastage: 33,
    power: 210,
    efficiency: 70
  },
  device5: {
    name: "Buld",
    status: "ONLINE",
    wastage: 21,
    power: 150,
    efficiency: 86
  }
};

// Save the data in Firebase
database.ref('energy').set(energyData);
database.ref('devices').set(devicesData);

console.log("Data has been added successfully!");

        // Fetch energy data
        wastageRef.on("value", snapshot => {
            const wastage = snapshot.val();
            document.getElementById("totalWastage").innerText = `${wastage} kWh`;
        });

        consumptionRef.on("value", snapshot => {
            const consumption = snapshot.val();
            document.getElementById("totalConsumption").innerText = `${consumption} W`;
        });

        efficiencyRef.on("value", snapshot => {
            const efficiency = snapshot.val();
            document.getElementById("avgEfficiency").innerText = `${efficiency}%`;
        });

        devicesRef.on("value", snapshot => {
            const devices = snapshot.val();
            document.getElementById("onlineDevices").innerText = `${Object.keys(devices).length} / 5`;
            updateDevices(devices);
        });

        // Update devices list
        function updateDevices(devices) {
            const container = document.getElementById("devicesContainer");
            container.innerHTML = ''; // Clear previous devices
            for (let deviceId in devices) {
                const device = devices[deviceId];
                const deviceCard = document.createElement("div");
                deviceCard.classList.add("device-card");
                deviceCard.innerHTML = `
                    <div class="device-name">${device.name}</div>
                    <div class="device-status">${device.status}</div>
                    <div>Wastage: ${device.wastage} kWh</div>
                    <div>Power: ${device.power} W</div>
                    <div>Efficiency: ${device.efficiency}%</div>
                    <div class="device-controls">
                        <button onclick="editDevice('${deviceId}')">Edit</button>
                        <button onclick="deleteDevice('${deviceId}')">Delete</button>
                        <button onclick="toggleDevice('${deviceId}')">${device.status === 'ONLINE' ? 'Off' : 'On'}</button>
                    </div>
                `;
                container.appendChild(deviceCard);
            }
        }

        // Edit Device (Placeholder function)
        function editDevice(deviceId) {
            console.log("Edit device: " + deviceId);
        }

        // Delete Device (Placeholder function)
        function deleteDevice(deviceId) {
            console.log("Delete device: " + deviceId);
        }

        // Toggle Device Status (ONLINE/OFFLINE)
        function toggleDevice(deviceId) {
            console.log("Toggle device status: " + deviceId);
        }

    </script>
</body>
</html>
